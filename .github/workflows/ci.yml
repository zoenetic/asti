name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build, test, validate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit & integration tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      # Rule-validation gate: every rule's per-rule fixtures must verify —
      # each `crit:expect` fires, each `crit:expect-not` stays silent, and no
      # finding lands on an unannotated line. New or edited rules that regress
      # fail the build here.
      - name: Verify rules against per-rule fixtures
        run: ./target/release/crit rules verify

      # Informational: taxonomy coverage vs OWASP Top 10 / CWE Top 25.
      - name: Taxonomy coverage report
        run: ./target/release/crit coverage

      # Smoke-test the Juliet benchmark scorer on the bundled sample (the full
      # NIST corpus is downloaded separately; see benchmarks/juliet/README.md).
      - name: Juliet benchmark harness smoke test
        run: python3 benchmarks/juliet/score.py benchmarks/juliet/sample
